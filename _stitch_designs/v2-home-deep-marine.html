<!doctype html>
<html class="dark" lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>BITE Log - v2 Deep Marine Glass</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@300;400;500;700&display=swap"
      rel="stylesheet"
    />
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              surface: "#0b1326",
              "surface-container-low": "#131b2e",
              "surface-container-high": "#222a3d",
              "surface-container-highest": "#2d3449",
              "surface-variant": "#2d3449",
              "on-surface": "#dae2fd",
              "on-surface-variant": "#bfc7d4",
              primary: "#9dcaff",
              secondary: "#5de6ff",
              "outline-variant": "#404752",
              background: "#0b1326",
            },
            fontFamily: {
              headline: ["Inter", "Noto Sans KR"],
              body: ["Noto Sans KR", "Inter"],
            },
          },
        },
      };
    </script>
    <style>
      body {
        font-family: "Noto Sans KR", "Inter", sans-serif;
        min-height: 100dvh;
      }
      .glass-card {
        background: rgba(34, 42, 61, 0.4);
        backdrop-filter: blur(24px);
      }
      .gradient-border {
        border: 1px solid rgba(157, 202, 255, 0.1);
      }
    </style>
  </head>
  <body class="bg-background text-on-surface pb-32">
    <header
      class="fixed top-0 w-full z-50 flex justify-between items-center px-6 h-16 bg-[#0b1326]/60 backdrop-blur-3xl"
    >
      <div class="flex items-center gap-3">
        <div
          class="w-8 h-8 bg-gradient-to-br from-[#1392ec] to-[#5de6ff] rounded-xl flex items-center justify-center"
        >
          <span class="text-white text-sm font-bold">B</span>
        </div>
        <div class="flex flex-col">
          <h1
            class="text-xl font-bold tracking-tight text-[#9dcaff] font-headline"
          >
            BITE Log
          </h1>
          <span class="text-[10px] text-on-surface-variant font-medium"
            >입질의 순간을 기록하다</span
          >
        </div>
      </div>
    </header>
    <main class="pt-20 px-4 space-y-8">
      <section
        class="relative w-full rounded-2xl overflow-hidden aspect-[4/5] flex items-end p-6"
      >
        <img
          alt="Fishing"
          class="absolute inset-0 w-full h-full object-cover"
          src="https://images.unsplash.com/photo-1504309092620-4d0ec726efa4?w=800&h=1000&fit=crop"
        />
        <div
          class="absolute inset-0 bg-gradient-to-t from-background via-background/40 to-transparent"
        ></div>
        <div
          class="relative w-full glass-card gradient-border p-6 rounded-2xl space-y-4"
        >
          <div class="flex justify-between items-start">
            <div>
              <span
                class="text-xs font-bold text-primary tracking-widest uppercase"
                >CURRENT STATUS</span
              >
              <h2 class="text-2xl font-bold text-white mt-1">
                오늘의 낚시 조건
              </h2>
            </div>
            <div class="relative w-16 h-16">
              <svg class="w-full h-full -rotate-90" viewBox="0 0 64 64">
                <circle
                  cx="32"
                  cy="32"
                  r="28"
                  fill="transparent"
                  stroke="rgba(255,255,255,0.1)"
                  stroke-width="4"
                />
                <circle
                  cx="32"
                  cy="32"
                  r="28"
                  fill="transparent"
                  stroke="#5de6ff"
                  stroke-width="4"
                  stroke-dasharray="175.9"
                  stroke-dashoffset="96.7"
                  stroke-linecap="round"
                />
              </svg>
              <div class="absolute inset-0 flex items-center justify-center">
                <span class="text-lg font-bold text-white">45</span>
              </div>
            </div>
          </div>
          <div class="flex flex-wrap gap-2">
            <span
              class="px-3 py-1 bg-primary/20 text-secondary text-xs rounded-full font-medium"
              >보통</span
            >
            <span
              class="px-3 py-1 bg-surface-container-high text-on-surface-variant text-[10px] rounded-full border border-outline-variant/20"
              >수온 14.2°C</span
            >
            <span
              class="px-3 py-1 bg-surface-container-high text-on-surface-variant text-[10px] rounded-full border border-outline-variant/20"
              >물세기 약함</span
            >
            <span
              class="px-3 py-1 bg-surface-container-high text-on-surface-variant text-[10px] rounded-full border border-outline-variant/20"
              >중들물</span
            >
          </div>
        </div>
      </section>
      <section class="grid grid-cols-3 gap-3">
        <div
          class="bg-surface-container-low p-4 rounded-xl flex flex-col items-center"
        >
          <span
            class="text-[10px] text-on-surface-variant uppercase tracking-tighter mb-1"
            >총 조과</span
          >
          <span class="text-lg font-bold text-primary">128</span>
          <span class="text-[10px] text-on-surface-variant">마리</span>
        </div>
        <div
          class="bg-surface-container-low p-4 rounded-xl flex flex-col items-center"
        >
          <span
            class="text-[10px] text-on-surface-variant uppercase tracking-tighter mb-1"
            >이번 달</span
          >
          <span class="text-lg font-bold text-secondary">15</span>
          <span class="text-[10px] text-on-surface-variant">마리</span>
        </div>
        <div
          class="bg-surface-container-low p-4 rounded-xl flex flex-col items-center"
        >
          <span
            class="text-[10px] text-on-surface-variant uppercase tracking-tighter mb-1"
            >최대어</span
          >
          <span class="text-lg font-bold text-white">58</span>
          <span class="text-[10px] text-on-surface-variant">cm</span>
        </div>
      </section>
      <section class="space-y-4">
        <h3 class="text-lg font-bold text-white px-2">어종별 활성도 랭킹</h3>
        <div
          class="flex overflow-x-auto pb-4 gap-4 -mx-4 px-4"
          style="scrollbar-width: none"
        >
          <div
            class="flex-none w-48 bg-gradient-to-br from-green-500/20 to-surface-container-low border border-green-500/20 rounded-2xl p-5 space-y-4"
          >
            <div class="flex justify-between items-start">
              <span class="text-2xl font-black text-green-400 opacity-50 italic"
                >01</span
              >
              <div class="text-right">
                <span
                  class="text-[10px] text-green-400 font-bold uppercase block"
                  >ACTIVE</span
                ><span class="text-xl font-bold text-white">우럭</span>
              </div>
            </div>
            <div class="flex items-end justify-between">
              <div>
                <span class="text-[10px] text-on-surface-variant block"
                  >BITE SCORE</span
                ><span class="text-2xl font-bold text-white"
                  >50<span class="text-xs font-normal text-on-surface-variant"
                    >/100</span
                  ></span
                >
              </div>
            </div>
          </div>
          <div
            class="flex-none w-48 bg-gradient-to-br from-blue-500/20 to-surface-container-low border border-blue-500/20 rounded-2xl p-5 space-y-4"
          >
            <div class="flex justify-between items-start">
              <span class="text-2xl font-black text-blue-400 opacity-50 italic"
                >02</span
              >
              <div class="text-right">
                <span
                  class="text-[10px] text-blue-400 font-bold uppercase block"
                  >MODERATE</span
                ><span class="text-xl font-bold text-white">광어</span>
              </div>
            </div>
            <div class="flex items-end justify-between">
              <div>
                <span class="text-[10px] text-on-surface-variant block"
                  >BITE SCORE</span
                ><span class="text-2xl font-bold text-white"
                  >45<span class="text-xs font-normal text-on-surface-variant"
                    >/100</span
                  ></span
                >
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>
    <button
      class="fixed bottom-24 right-6 bg-gradient-to-br from-[#1392ec] to-[#5de6ff] text-[#002b4c] h-14 px-6 rounded-full shadow-[0_12px_32px_-4px_rgba(0,98,162,0.4)] flex items-center gap-2 font-bold text-sm z-40"
    >
      📷 기록하기
    </button>
    <nav
      class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 pb-6 pt-2 bg-[#0b1326]/60 backdrop-blur-3xl rounded-t-2xl"
    >
      <a
        class="flex flex-col items-center bg-[#1c95f0]/20 text-[#5de6ff] rounded-2xl px-3 py-1"
        href="#"
        ><span class="text-lg">🏠</span><span class="text-[10px]">홈</span></a
      >
      <a class="flex flex-col items-center text-[#bfc7d4] px-3 py-1" href="#"
        ><span class="text-lg">📡</span
        ><span class="text-[10px]">레이더</span></a
      >
      <a class="flex flex-col items-center text-[#bfc7d4] px-3 py-1" href="#"
        ><span class="text-lg">✨</span><span class="text-[10px]">AI</span></a
      >
      <a class="flex flex-col items-center text-[#bfc7d4] px-3 py-1" href="#"
        ><span class="text-lg">🏆</span><span class="text-[10px]">랭킹</span></a
      >
      <a class="flex flex-col items-center text-[#bfc7d4] px-3 py-1" href="#"
        ><span class="text-lg">⚙️</span><span class="text-[10px]">설정</span></a
      >
    </nav>
  </body>
</html>
